<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.aframe.io;
  style-src 'self' 'unsafe-inline' https://cdn.aframe.io;
  connect-src 'self' https://cdn.aframe.io;
  img-src 'self' data: https://cdn.aframe.io;
  font-src 'self' https://cdn.aframe.io;
">
  <title>AR Großer Ötscher – CSP-Fix</title>

  <!-- Lokale Skripte (kein CORS/CORB!) -->
  <script src="js/aframe.min.js"></script>
  <script src="js/aframe-ar.min.js"></script>

  <!-- Kamera-Parameter (lokal) -->
  <!-- Kamera-Parameter NACH den Skripten definieren -->
  <script>
    // Warte, bis A-Frame und AR.js geladen sind
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof AFRAME !== 'undefined' && typeof AFRAME.ARJS !== 'undefined') {
        AFRAME.ARJS.CameraParameters = {
          url: 'js/camera_para.dat'
        };
      }
    });
  </script>

  <style>
    body { margin: 0; padding: 0; overflow: hidden; }
    #info {
      position: absolute; top: 10px; left: 10px; right: 10px;
      background: rgba(0,0,0,0.8); color: white; padding: 15px;
      border-radius: 10px; z-index: 1000; text-align: center;
    }
    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); color: white;
      display: flex; justify-content: center; align-items: center;
      z-index: 2000;
    }
    #error {
      position: absolute; bottom: 20px; left: 10px; right: 10px;
      background: rgba(255,0,0,0.8); color: white; padding: 10px;
      border-radius: 5px; z-index: 1000; display: none;
    }
  </style>
</head>
<body>
  <div id="loading">Lade AR... (Kamera wird gleich angefragt!)</div>
  <div id="error">Kamera blockiert? Nutze <strong>Chrome/Edge</strong> und erlaube die Kamera!</div>
  <div id="info">
    <h1>🏔 AR Großer Ötscher</h1>
    <p>Halte die Kamera auf den <a href="https://jeromeetienne.github.io/AR.js/data/images/HIRO.jpg" style="color: #FFD700;">Hiro-Marker</a>!</p>
  </div>

  <a-scene embedded arjs="sourceType: webcam; detectionMode: mono; trackingMethod: best;">
    <a-entity camera look-controls="pointerLockEnabled: false"></a-entity>
    
    <a-marker preset="hiro">
      <a-sky color="#E0F7FA"></a-sky>
      
      <!-- Berg -->
      <a-entity geometry="primitive: box; width: 4; height: 1.5; depth: 2" 
                material="color: #5A4D41; opacity: 0.9; transparent: true" 
                position="0 0.75 0"></a-entity>
      
      <!-- Gipfel -->
      <a-entity geometry="primitive: cone; radius-bottom: 0.3; height: 0.8" 
                material="color: #FFD700; opacity: 0.9" 
                position="0 1.5 0.2">
        <a-entity text="value: Großer Ötscher (2.754 m); align: center; width: 3; color: white" 
                  position="0 0.5 0" scale="0.5 0.5 0.5"></a-entity>
      </a-entity>
      
      <!-- Nebengipfel -->
      <a-entity geometry="primitive: cone; radius-bottom: 0.2; height: 0.6" 
                material="color: #FF6B6B; opacity: 0.9" 
                position="-0.8 1.2 -0.3">
        <a-entity text="value: Mittlerer Ötscher; align: center; width: 2; color: white" 
                  position="0 0.4 0" scale="0.4 0.4 0.4"></a-entity>
      </a-entity>
      
      <!-- Gletscher -->
      <a-entity geometry="primitive: plane; width: 1.2; height: 0.5" 
                material="color: #4ECDC4; opacity: 0.7; transparent: true; side: double" 
                position="-0.3 0.5 -0.8" rotation="-20 0 0">
        <a-entity text="value: Ötschergletscher; align: center; width: 2; color: white" 
                  position="0 0.3 0" scale="0.4 0.4 0.4"></a-entity>
      </a-entity>
      
      <!-- Kompass -->
      <a-entity geometry="primitive: cone; radius-bottom: 0.1; height: 0.3" 
                material="color: #FF0000" 
                position="0 0 -1">
        <a-entity text="value: N; align: center; width: 0.5; color: white" 
                  position="0 0.2 0" scale="0.3 0.3 0.3"></a-entity>
      </a-entity>
    </a-marker>
  </a-scene>

  <script>
    document.querySelector('a-scene').addEventListener('loaded', function() {
      setTimeout(() => {
        document.getElementById('loading').style.display = 'none';
      }, 1500);
    });

    // iOS-Kamera-Berechtigung
    if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      document.addEventListener('click', function() {
        if (typeof AFRAME !== 'undefined' && AFRAME.ARJS) {
          AFRAME.ARJS.requestCameraPermission();
        }
      });
    }
  </script>
</body>
</html>
